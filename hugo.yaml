# Minimal single-language profile. Copy this file to ../hugo.yaml to use it.
title: Kenan Hulusi Koray
baseURL: https://mahoni789.github.io/Kenan-Hulusi/
defaultContentLanguage: tr
enableGitInfo: true
enableRobotsTXT: true

languages:
  tr:
    label: Türkçe
    locale: tr-TR
    weight: 1
    title: Kenan Hulusi Koray
    params:
      description: Kenan Hulusi Koray'ın bütün eserleri.

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  logo: logo.png
  offline_search: true
  copyright:
    authors: Miras
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
